name: PR 2 final validation

on:
  push:
    branches:
      - agent/execution-environments-github-sandboxes
    paths:
      - .github/workflows/pr2-ci-final.yml

concurrency:
  group: pr2-ci-final
  cancel-in-progress: true

jobs:
  validate:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout triggering commit without credentials
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/${{ github.repository }}.git
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach "$GITHUB_SHA"

      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Apply final CI fixes
        run: python scripts/pr2-ci-final.py

      - name: Format
        run: vp fmt

      - name: Check
        run: vp check

      - name: Typecheck
        run: vpr typecheck

      - name: Test
        run: vp test

      - name: Release smoke
        run: vp run release:smoke

      - name: Remove temporary patch
        run: git rm -f scripts/pr2-ci-final.py

      - name: Commit validated tree
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "Artur Lauche"
          git config user.email "118263652+ArturLauche@users.noreply.github.com"
          git add -u
          git diff --cached --check
          git commit -m "fix: normalize final PR validation"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            push --force-with-lease=refs/heads/agent/execution-environments-github-sandboxes:"$GITHUB_SHA" \
            origin HEAD:agent/execution-environments-github-sandboxes

# trigger: final typecheck corrections
