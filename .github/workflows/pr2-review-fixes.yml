name: PR 2 review fixes

on:
  push:
    branches:
      - agent/execution-environments-github-sandboxes

permissions:
  contents: write

concurrency:
  group: pr2-review-fixes
  cancel-in-progress: true

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Apply fixes
        run: node scripts/pr2-review-fixes.mjs

      - name: Format changed files
        run: vp fmt

      - name: Check
        run: vp check

      - name: Typecheck
        run: vpr typecheck

      - name: Test
        run: vp test

      - name: Release smoke
        run: node scripts/release-smoke.ts

      - name: Diff check
        run: git diff --check

      - name: Commit validated fixes
        run: |
          rm scripts/pr2-review-fixes.mjs .github/workflows/pr2-review-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: address PR review feedback"
          git push origin HEAD:agent/execution-environments-github-sandboxes
