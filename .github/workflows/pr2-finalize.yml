name: PR 2 finalize review fixes

on:
  push:
    branches:
      - agent/execution-environments-github-sandboxes
    paths:
      - .github/workflows/pr2-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/execution-environments-github-sandboxes
          fetch-depth: 0

      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: false
          run-install: true

      - name: Apply remaining source review fixes
        run: |
          python scripts/fix-pr2-runner.py
          python scripts/pr2-final-source.py
          python scripts/pr2-final-post.py
          python scripts/pr2-final-type.py

      - name: Format
        run: vp fmt

      - name: Static checks
        run: vp check

      - name: Typecheck
        run: vpr typecheck

      - name: Tests
        run: vp test

      - name: Release smoke
        run: vp run release:smoke

      - name: Remove temporary source patches
        run: git rm scripts/pr2-final-source.py scripts/fix-pr2-runner.py scripts/pr2-final-post.py scripts/pr2-final-type.py

      - name: Commit validated source fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Artur Lauche"
          git config user.email "118263652+ArturLauche@users.noreply.github.com"
          git add -u
          git diff --cached --check
          git commit -m "fix: close remaining PR review findings"
          git push origin HEAD:agent/execution-environments-github-sandboxes

# trigger: bypass stalled dependency cache restore
